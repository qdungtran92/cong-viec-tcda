<title>Công việc TCDA</title>
<style>
/* Design read: internal daily-use app, calm & quiet. Variance 3 / Motion 3 / Density 4.
   Palette: cool neutral + navy ink + one blue accent. Semantic red/amber/green used as text marks only.
   Radius system: surfaces 16px, controls 12px, chips pill. */
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--ink:#0F1E36;--ink2:#3A4658;--muted:#6E7887;--faint:#9AA3AF;
  --line:#E7E9ED;--line2:#F0F1F4;
  --accent:#1F5FD6;--accent-ink:#1A4FB3;--accent-soft:#EEF3FC;
  --red:#C93C3C;--amber:#B26A00;--green:#1E8A57;--grey:#9AA3AF;
  --r:16px;--r-c:12px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--tabh:62px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI Variable Display','Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
.muted{color:var(--muted)}
.small{font-size:13px}
.red{color:var(--red)}.amber{color:var(--amber)}.green{color:var(--green)}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,245,247,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding:calc(10px + var(--safe-t)) 18px 8px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center;color:#fff;flex:none}
.brand-txt b{display:block;font-size:14.5px;font-weight:600;color:var(--ink)}
.brand-txt span{display:none}
.icon-btn{width:40px;height:40px;border-radius:var(--r-c);display:grid;place-items:center;position:relative;color:var(--ink2)}
.icon-btn:active{background:var(--line)}
.icon-btn.on{color:var(--accent)}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
.demo-strip{background:#FFF6E6;color:#7A4B00;font-size:13px;padding:7px 18px;display:flex;gap:10px;align-items:center;justify-content:center}
.demo-strip button{font-weight:600;text-decoration:underline}
.ro-strip{font-size:13px;color:var(--muted);padding:4px 18px;text-align:center}

/* layout */
main{padding:6px 16px calc(var(--tabh) + var(--safe-b) + 32px);max-width:860px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;gap:10px;margin:6px 2px 16px}
.page-h>div{flex:1;min-width:0}
.page-h h1{font-size:26px;line-height:1.15;margin:0;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px}
.sec-h h2{font-size:15px;margin:0;font-weight:600;color:var(--ink2)}
.sec-h .cnt{font-weight:600;color:var(--faint);margin-left:6px}
.sec-h .link,.link{font-size:14px;color:var(--accent);font-weight:600}
.surface{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.pad{padding:16px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* rows */
.group{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;min-height:60px;position:relative;transition:background .12s}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line2)}
.row.noic+.row.noic::before,.row.noic+.row::before{left:16px}
.row:active{background:#F7F8FA}
.row-main{flex:1;min-width:0}
.row-t{font-size:15px;font-weight:500;color:var(--ink);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-t.one{-webkit-line-clamp:1}
.row-s{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:10px;align-items:center;white-space:nowrap;overflow:hidden}
.row-s>span{overflow:hidden;text-overflow:ellipsis}
.trail{flex:none;display:flex;align-items:center;gap:6px;color:var(--faint);font-size:14px;font-weight:600}
.trail .pct{color:var(--ink2);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.lead{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px}
.lead.r{color:var(--red);background:#FCEEEE}.lead.a{color:var(--amber);background:#FFF5E5}.lead.b{color:var(--accent);background:var(--accent-soft)}
.datebox{width:34px;flex:none;text-align:center;line-height:1.05}
.datebox b{display:block;font-size:17px;color:var(--ink)}
.datebox span{font-size:11px;color:var(--muted)}
.prio{color:var(--red)}
.more{display:block;width:100%;padding:13px 16px;font-size:14px;font-weight:600;color:var(--accent);border-top:1px solid var(--line2);text-align:center}

/* avatars */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12.5px;flex:none;letter-spacing:.01em}
.av.sm{width:24px;height:24px;font-size:10px}
.av.xs{width:20px;height:20px;font-size:9px}

/* hero (dashboard) */
.hero{padding:20px 18px 6px}
.hero-top{display:flex;align-items:flex-end;gap:12px}
.hero-big{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.hero-big small{font-size:22px;color:var(--faint);font-weight:600;margin-left:2px}
.hero-sub{font-size:14px;color:var(--muted);padding-bottom:5px}
.sbar{display:flex;gap:3px;height:8px;margin:16px 0 4px}
.sbar i{display:block;height:100%;border-radius:4px;min-width:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:6px -6px 0}
.stat{padding:10px 6px 12px;border-radius:12px;text-align:left}
.stat:active{background:var(--line2)}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.stat span i{width:8px;height:8px;border-radius:2px;flex:none}
.stat.alert b{color:var(--red)}

/* chips / seg / filter */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 2px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .x{opacity:.7}
.seg{display:flex;background:#E9EBEF;border-radius:var(--r-c);padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap;padding:0 10px;text-align:center}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,30,54,.1)}
.toolbar{display:grid;gap:12px;margin-bottom:16px}
.search{position:relative}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:40px;background:var(--surface)}
.fbtn{position:relative}
.fbtn .dotc{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* form */
.field{margin-bottom:18px}
.field>label,.flabel{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.inp,.sel{width:100%;min-height:46px;border:1px solid var(--line);border-radius:var(--r-c);background:#fff;padding:11px 13px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{min-height:72px;resize:vertical;line-height:1.45}
.inp::placeholder{color:#8A93A0}
.inp:focus,.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,214,.14)}
.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6E7887 50%),linear-gradient(135deg,#6E7887 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qchips{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 8px;padding:0 16px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchips.wrap{flex-wrap:wrap;overflow:visible;margin:0 0 8px;padding:0}
.qchip{flex:none;height:34px;padding:0 13px;border-radius:17px;background:#fff;border:1px solid var(--line);color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap}
.qchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.qchip.plan{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.btn{height:48px;border-radius:var(--r-c);padding:0 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--accent);color:#fff}
.btn-sec{background:var(--accent-soft);color:var(--accent-ink)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn-danger{background:#fff;border:1px solid #F1D5D5;color:var(--red)}
.btn-sm{height:38px;font-size:14px;padding:0 14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.toggle2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle2 button{height:44px;border-radius:var(--r-c);border:1px solid var(--line);background:#fff;font-weight:500;color:var(--ink2);text-align:center}
.toggle2 button.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:600}
.toggle2 button.on.yes{border-color:var(--red);background:#FCEEEE;color:var(--red)}
.switch{width:46px;height:28px;border-radius:14px;background:#D3D8DF;position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:21px}
.multi{display:flex;flex-wrap:wrap;gap:7px}
.multi button{height:36px;padding:0 12px 0 5px;border-radius:18px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500}
.multi button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

/* progress */
.pbar{height:6px;border-radius:3px;background:#ECEEF2;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.range-wrap{padding:4px 0}
.range-top{display:flex;align-items:center;justify-content:space-between}
.range-val{font-size:34px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.range-val small{font-size:17px;color:var(--faint);font-weight:600}
.stepper{display:flex;gap:6px}
.stepper button{min-width:46px;height:40px;border-radius:var(--r-c);background:#fff;border:1px solid var(--line);font-weight:600;color:var(--ink2);text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p,0%),#DCE1E8 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid #CBD2DC;margin-top:-10px;box-shadow:0 2px 6px rgba(15,30,54,.2)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#DCE1E8}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid #CBD2DC}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.presets button{height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink2);text-align:center}
.presets button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* charts */
.chart{padding:16px}
.chart h3{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--ink)}
.hbar-row{display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:10px;margin:10px 0}
.hbar-row .n{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar{display:flex;gap:2px;height:12px}
.hbar i{display:block;height:100%;border-radius:3px}
.hbar-row .v{font-size:13px;font-weight:600;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-leg{flex:1;display:grid;gap:8px}
.donut-leg div{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2)}
.donut-leg i{width:9px;height:9px;border-radius:2px}
.donut-leg b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
.vbars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:16px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.vbar i{display:block;width:100%;max-width:22px;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:2px}
.vbar i.z{background:#E3E6EB}
.vbar em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink2)}
.vbar span{font-size:10.5px;color:var(--faint)}

/* kanban & calendar */
.kanban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 12px}
.kcol{flex:0 0 82%;max-width:330px;scroll-snap-align:start}
.kcol-h{display:flex;align-items:center;gap:8px;padding:0 4px 10px;font-weight:600;font-size:14px;color:var(--ink2)}
.kcol-h .cnt{color:var(--faint)}
.kcol .kl{display:grid;gap:8px;min-height:120px;border-radius:var(--r);padding:2px}
.kcol.drop .kl{outline:2px dashed var(--accent);outline-offset:2px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;display:block}
.kcard:active{background:#F7F8FA}
.kcard .row-t{font-size:14.5px}
.kcard .kf{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.kcard .kf .pct{margin-left:auto;font-weight:600;color:var(--ink2)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:16px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dow{font-size:12px;font-weight:500;color:var(--faint);text-align:center;padding:4px 0 8px}
.cday{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.cday .dn{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.cday.out .dn{color:#C3C8D0}
.cday.today .dn{color:var(--accent);font-weight:600}
.cday.sel .dn{background:var(--ink);color:#fff;font-weight:600}
.cday .mk{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cday .mk.r{background:var(--red)}
.fab{position:fixed;right:18px;bottom:calc(var(--tabh) + var(--safe-b) + 16px);width:54px;height:54px;border-radius:17px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(15,30,54,.25);z-index:35}
.fab:active{transform:scale(.95)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--ntab,5),1fr);padding:6px 4px calc(4px + var(--safe-b));height:calc(var(--tabh) + var(--safe-b))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:#8A93A0;position:relative;text-align:center}
.tab.on{color:var(--accent)}
.tab .tdot{position:absolute;top:2px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--red)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,30,54,.36);z-index:60;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:20px 20px 0 0;height:94vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s var(--ease)}
.sheet.show{transform:none}
.sheet-grab{width:36px;height:5px;border-radius:3px;background:#CDD2DA;margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 18px;flex:none}
.sheet-h h3{margin:0;font-size:16px;font-weight:600;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{flex:1;overflow-y:auto;padding:8px 16px 24px;-webkit-overflow-scrolling:touch}
.sheet-f{flex:none;padding:10px 16px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:#fff;display:flex;gap:10px}
.sheet-f .btn{flex:1}
.close-x{width:36px;height:36px;border-radius:50%;background:#E6E9EE;display:grid;place-items:center;color:var(--ink2);flex:none}
.d-title{font-size:20px;font-weight:600;line-height:1.3;margin:2px 2px 4px;letter-spacing:-.01em}
.d-sub{font-size:14px;color:var(--muted);margin:0 2px}
.d-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:16px}
.d-meta .l{font-size:12.5px;color:var(--muted)}
.d-meta .v{font-size:14.5px;font-weight:500;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.d-prog{display:flex;align-items:center;gap:12px;padding:0 16px 16px}
.d-prog .pbar{flex:1}
.d-prog b{font-variant-numeric:tabular-nums}
.d-actions{display:flex;gap:8px;margin-top:12px}
.d-actions .btn-pri{flex:1}
.d-sec{margin-top:22px}
.d-sec h5{margin:0 4px 8px;font-size:14px;font-weight:600;color:var(--ink2)}
.d-box{background:#fff;border-radius:var(--r);padding:13px 16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;border:1px solid var(--line)}
.d-box.warn{background:#FFF8EC;border-color:#F3E1BF;color:#5E3E00}
.tl-item{display:flex;gap:10px;padding:10px 0}
.tl-item+.tl-item{border-top:1px solid var(--line2)}
.tl-body{flex:1;min-width:0}
.tl-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tl-h b{color:var(--ink);font-weight:600;font-size:14px}
.tl-b{font-size:14px;margin-top:3px;line-height:1.5;white-space:pre-wrap;color:var(--ink2)}
.tl-b .k{color:var(--muted)}
.tl-b.req{color:var(--amber)}
.cmt-box{display:flex;gap:8px;align-items:flex-end;margin-bottom:6px}
.cmt-box textarea{min-height:46px;height:46px}
.links a{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r-c);margin-bottom:6px;font-size:14px;text-decoration:none;word-break:break-all}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--line2);color:var(--ink2)}
.tag.r{background:#FCEEEE;color:var(--red)}.tag.a{background:#FFF5E5;color:var(--amber)}.tag.b{background:var(--accent-soft);color:var(--accent-ink)}.tag.g{background:#E9F6EF;color:var(--green)}
.code{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* report */
.rep-nav{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.rep-nav .lbl{flex:1;text-align:center;font-weight:600}
.rep-nav input{max-width:180px;min-height:40px;padding:6px 10px;text-align:center;margin:0 auto;display:block}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.kv>div{background:#fff;padding:12px 14px}
.kv b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kv span{font-size:12.5px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-size:12.5px;font-weight:500;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow:auto}
.upd-item{padding:12px 16px}
.upd-item+.upd-item{border-top:1px solid var(--line2)}
.upd-item .h{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.upd-item .t{font-size:14.5px;font-weight:500;margin-top:2px;color:var(--ink)}
.upd-item .b{font-size:14px;color:var(--ink2);margin-top:2px;line-height:1.5}
.upd-item .b .k{color:var(--muted)}

/* profile */
.prof{display:flex;align-items:center;gap:14px;padding:4px 2px 0}
.prof .av{width:56px;height:56px;font-size:19px}
.prof h2{margin:0;font-size:20px;font-weight:600}
.prof p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* notifications, toast, modal */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 20px);transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--r-c);font-size:14px;font-weight:500;z-index:90;opacity:0;transition:all .22s var(--ease);max-width:calc(100vw - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red)}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(15,30,54,.4)}
.modal .box{background:#fff;border-radius:18px;padding:20px;max-width:360px;width:100%}
.modal h4{margin:0 0 6px;font-size:17px}
.modal p{margin:0 0 18px;color:var(--ink2);font-size:14.5px}
.modal .acts{display:flex;gap:8px}
.modal .acts .btn{flex:1}

/* gate / loading */
.gate{max-width:440px;margin:4vh auto 0}
.gate h1{font-size:24px;margin:16px 0 6px;letter-spacing:-.02em}
.gate p{color:var(--ink2);margin:0 0 18px;font-size:15px}
.skel{height:64px;border-radius:var(--r);background:linear-gradient(90deg,#E9EBEF 25%,#F2F3F5 50%,#E9EBEF 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.notice{background:#FFF8EC;border:1px solid #F3E1BF;color:#5E3E00;border-radius:var(--r-c);padding:11px 14px;font-size:14px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* responsive */
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}.kcol{flex-basis:300px}.kv{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1024px){
  body{padding-left:220px}
  .tabbar{top:0;right:auto;width:220px;height:auto;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:2px;border-top:0;border-right:1px solid var(--line);padding:72px 10px 12px;background:#fff}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;height:42px;padding:0 12px;font-size:14.5px;color:var(--ink2);border-radius:10px}
  .tab.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .tab .tdot{top:10px;left:28px}
  .topbar{padding:14px 32px 10px}
  main{padding:8px 32px 48px;max-width:1120px}
  .fab{bottom:32px;right:32px}
  .kanban{margin:0;padding:2px 0 12px}
  .kcol{flex:1 1 0;max-width:none}
  .sheet{left:auto;top:0;width:520px;height:100vh;border-radius:20px 0 0 20px;transform:translateX(100%)}
  .sheet-grab{display:none}
  .sheet-h{padding-top:16px}
  .toast{bottom:28px}
  .cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
  .cols>div>.sec:first-child{margin-top:0}
}
@media (min-width:1024px){.cols{margin-top:26px}}
